{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-fluid">
    <div id="edit-recipe-hero" class="row text-center"
        {% if recipe.image %}style="background-image: url('{{ recipe.image.url }}');"{% endif %}>
        <h2 class="my-auto">Edit <strong>{{ recipe.title }}</strong></h2>
    </div>
    <div class="row mt-5">
        <div class="col-12 col-md-6 col-lg-4 offset-lg-4">
            <form method="POST" action="{% url 'edit_recipe' recipe.slug %}" class="form mb-3" enctype="multipart/form-data">
                {% csrf_token %}
                {{ recipe_form | crispy | safe }}
                <a href="{% url 'home' %}" class="btn btn-red">Cancel</a>
                <button type="submit" class="btn btn-black">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
