{% extends "base.html" %}
{% load static %}

{% block page_header %}
    <div class="container header-container">
        <div class="row">
            <div class="col"></div>
        </div>
    </div>
{% endblock %}

{% block content %}
    <div class="containter h-100">
        <div class="row h-100">
            <div class="col-7 col-md-6 my-auto">
                <h1 class="display-4 logo-font text-black">
                    All Live Recipes
                </h1>
                <p class="lead text-black">
                    Welcome to My Cook Book! Explore a variety of delicious recipes and find your next favorite dish.
                </p>
            </div>
            <div class="col-5 col-md-6 my-auto">
                <form method="GET" action="" class="d-flex">
                    <div class="input-group w-100">
                        <input class="form-control border border-black rounded-0" type="text" name="q"
                            placeholder="Search ingredients / recipes..." value="{{ request.GET.search }}">
                        <div class="input-group-append">
                            <button class="form-control btn btn-black border border-black rounded-0" type="submit">
                            <span class="icon">
                                <i class="fas fa-search"></i>
                            </span>
                        </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
